<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zenith Hub</title>
<style>
@property --h{syntax:'<number>';inherits:true;initial-value:0}
:root{--bg:#0B0C10;--p:#1F2833;--p2:#171e27;--t:#e9e4ff;--m:#8f93a8;--gold:#d4af37;--cu:#b87333;--vi:#7b5cff;--lav:#d9c8ff;--teal:#4fd6c8;--lime:#e8ff8a;animation:hue 6s linear infinite}
@keyframes hue{to{--h:360}}
*{box-sizing:border-box;margin:0}
body{font:14px/1.45 system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--t);height:100dvh;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
[hidden]{display:none!important}
*:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px hsl(var(--h) 100% 65%),0 0 16px hsl(var(--h) 100% 60%/.6)}
/* prism slash trail */
.pr{position:relative;overflow:hidden;isolation:isolate}
.pr::after{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:0;background:linear-gradient(115deg,transparent 38%,#ff4d6d,#ffb84d,#fff06a,#5dffa0,#4dc9ff,#b06bff,transparent 62%);background-size:300% 100%;background-position:150% 0}
.pr:hover::after,.pr:active::after,.pr:focus-visible::after{opacity:.55;animation:slash .6s ease-out}
@keyframes slash{from{background-position:150% 0}to{background-position:-50% 0}}
.pr.on::before{content:'';position:absolute;left:0;top:18%;bottom:18%;width:3px;border-radius:3px;background:linear-gradient(#ff4d6d,#ffb84d,#fff06a,#5dffa0,#4dc9ff,#b06bff,#ff4d6d);background-size:100% 300%;animation:flow 2s linear infinite}
@keyframes flow{to{background-position:0 300%}}
#app{display:grid;grid-template-columns:64px 232px 1fr 232px;height:100%}
#app.nomem{grid-template-columns:64px 232px 1fr 0}
#sb{background:#07080b;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0;border-right:1px solid #000}
.si{width:44px;height:44px;border-radius:14px;background:var(--p);border:1px solid #2c3948;display:grid;place-items:center;font-weight:700;color:var(--gold)}
.si.on{border-color:var(--gold);box-shadow:0 0 12px #d4af3755}
#ch{background:var(--p2);overflow:auto;border-right:1px solid #000;display:flex;flex-direction:column}
.brand{padding:14px;font-weight:800;letter-spacing:.06em;color:var(--gold);border-bottom:1px solid #000;background:linear-gradient(135deg,#1F2833,#171e27)}
.cat{margin:10px 8px 2px;font-size:11px;letter-spacing:.1em;color:var(--m);cursor:pointer;text-transform:uppercase}
.cat:hover{color:var(--lav)}
.c{display:block;width:calc(100% - 12px);margin:1px 6px;text-align:left;background:none;border:0;padding:6px 10px;border-radius:7px;color:var(--m)}
.c:hover,.c.on{color:var(--t);background:#1F283399}
.c.inc{color:#c9a8ff}
#main{display:flex;flex-direction:column;min-width:0;height:100%;background:var(--bg)}
#hd{display:flex;gap:6px;align-items:center;padding:9px 14px;border-bottom:1px solid #000;background:linear-gradient(90deg,#1F2833,#0B0C10)}
#hd h2{font-size:15px;color:var(--gold);white-space:nowrap}
#fpr{font-size:12px;color:var(--teal);white-space:nowrap}
#q{flex:1;min-width:80px;background:#0B0C10;border:1px solid #2c3948;border-radius:8px;padding:5px 10px}
.ib{background:var(--p);border:1px solid #2c3948;border-radius:8px;padding:4px 9px}
select.ib{padding:4px}
#feed{flex:1;overflow:auto;padding:10px 0;position:relative}
.msg{display:flex;gap:10px;padding:5px 16px;position:relative}
.msg:hover{background:#1F283366}.msg.sel{background:#1F2833;box-shadow:inset 3px 0 var(--gold)}.msg.pin{box-shadow:inset 3px 0 var(--cu)}
.av{width:36px;height:36px;border-radius:12px;flex:none}
.bd{min-width:0;flex:1}.hd b{margin-right:4px}.hd time{font-size:11px;color:var(--m)}
.role{font-size:10px;padding:0 5px;border-radius:5px;border:1px solid;margin-right:4px}
.r-Owner{color:var(--gold)}.r-Admin{color:var(--cu)}.r-Mod{color:var(--teal)}.r-Member{color:var(--m)}
.tx{overflow-wrap:anywhere}.tx a{color:var(--teal)}
.q,.bq{border-left:3px solid var(--cu);padding-left:8px;color:var(--m);font-size:13px;margin:2px 0}
.ed{color:var(--m)}
.mn{background:#7b5cff33;border-radius:5px;padding:0 3px}.mn.me{background:#d4af3744;outline:1px solid var(--gold)}
code{background:#000;border-radius:5px;padding:0 4px;font:13px ui-monospace,Menlo,monospace}
.cb{position:relative;margin:4px 0}.cb pre{background:#000;border:1px solid #2c3948;border-radius:8px;padding:8px 10px;overflow:auto}.cb code{background:none;padding:0}
.cp{position:absolute;right:6px;top:6px;font-size:11px;background:var(--p);border:1px solid #2c3948;border-radius:6px;padding:1px 7px}
.kw{color:#b06bff;font-style:normal}.st{color:var(--lime);font-style:normal}.nm{color:#ffb84d;font-style:normal}.cm{color:#6c7a89;font-style:normal}
.sp{background:#000;color:#000;border-radius:4px;padding:0 3px;cursor:pointer}.sp.on{color:inherit;background:#ffffff22}
.rxs{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.rx{background:var(--p);border:1px solid #2c3948;border-radius:99px;padding:0 8px;font-size:12px}.rx.on{border-color:var(--gold)}
.tb{position:absolute;right:14px;top:-12px;display:none;gap:2px;background:var(--p);border:1px solid #2c3948;border-radius:8px;padding:2px}
.msg:hover .tb,.msg.sel .tb{display:flex}
.tb button{background:none;border:0;padding:1px 6px;border-radius:6px}
.thl{font-size:12px;color:var(--teal);background:none;border:0;padding:0}
.poll{margin:4px 0;display:grid;gap:4px;max-width:360px}.poll button{text-align:left;background:var(--p);border:1px solid #2c3948;border-radius:8px;padding:4px 10px}
.inc .tx,#thr .tx.x{}
.incm .tx{filter:blur(7px);transition:filter .15s}.incm .tx:hover{filter:none}
.fire{font-size:11px;color:#ff8a4d;margin-left:6px}
#pill{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);background:var(--gold);color:#0B0C10;border:0;border-radius:99px;padding:6px 16px;font-weight:700;box-shadow:0 0 14px #d4af37aa}
#typ{height:18px;padding:0 18px;font-size:12px;color:var(--m)}
#rp{padding:5px 18px;background:var(--p);font-size:12px;color:var(--m);cursor:pointer}
#cmp{display:flex;gap:8px;padding:8px 14px 14px;position:relative}
#in{flex:1;resize:none;background:var(--p);border:1px solid #2c3948;border-radius:10px;padding:10px 12px;max-height:140px}
#ac{position:absolute;bottom:62px;left:14px;background:var(--p);border:1px solid var(--gold);border-radius:8px;overflow:hidden}
#ac div{padding:4px 12px}#ac div.on{background:#000}
#mem{background:var(--p2);overflow:auto;border-left:1px solid #000;padding:8px}
.mh{font-size:11px;color:var(--m);margin:10px 6px 4px;letter-spacing:.08em;text-transform:uppercase}
.mb{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:8px}.mb:hover{background:#1F2833}
.mb .a{position:relative;width:30px;height:30px}.mb img{width:30px;height:30px;border-radius:10px}
.dot{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;border:2px solid var(--p2);background:#555}
.online{background:#43d17a}.idle{background:#ffb84d}.dnd{background:#ff4d6d}
.mb small{display:block;color:var(--m);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.me2{background:#1F2833;border:1px solid var(--cu);border-radius:10px;padding:8px;display:grid;gap:6px}
.me2 input,.me2 select{background:#0B0C10;border:1px solid #2c3948;border-radius:6px;padding:3px 6px;width:100%}
.dw{position:fixed;top:0;right:0;bottom:0;width:min(360px,100%);background:var(--p2);border-left:2px solid var(--gold);z-index:20;display:flex;flex-direction:column;padding:12px;gap:8px;overflow:auto}
.dw h3{color:var(--gold)}.al{font-size:12px;border-bottom:1px solid #2c3948;padding:4px 0}
#pal{margin:12vh auto;background:var(--p);color:var(--t);border:2px solid var(--gold);border-radius:12px;width:min(460px,94vw);padding:10px}
#pal::backdrop{background:#000a}#pi{width:100%;background:#0B0C10;border:1px solid #2c3948;border-radius:8px;padding:8px;margin-bottom:6px}
#pl button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:6px 8px}#pl button.on{background:#000}
#ctx{position:fixed;z-index:40;background:var(--p);border:1px solid var(--gold);border-radius:8px;padding:4px;min-width:170px}
#ctx button{display:block;width:100%;text-align:left;background:none;border:0;padding:5px 10px;border-radius:6px}
#emo{position:fixed;z-index:30;background:var(--p);border:1px solid var(--gold);border-radius:10px;padding:6px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-width:280px}
#emo button{background:none;border:0;font-size:18px;border-radius:6px}#emo input{grid-column:1/-1;background:#0B0C10;border:1px solid #2c3948;border-radius:6px;padding:3px 6px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--cu);color:#fff;padding:7px 16px;border-radius:10px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}#toast.on{opacity:1}
#decoy{position:fixed;inset:0;z-index:100;background:#fff;color:#222;font:13px Arial,sans-serif}
#decoy h1{font-size:18px;padding:10px 14px;border-bottom:1px solid #ddd;user-select:none}
#decoy table{border-collapse:collapse;margin:10px}#decoy td{border:1px solid #ddd;padding:4px 18px}
.voice{display:grid;place-items:center;height:100%;color:var(--m);text-align:center}
@media(max-width:820px){#app,#app.nomem{grid-template-columns:52px 150px 1fr 0}#mem{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<div id="app">
<nav id="sb"><div class="si on pr"><svg viewBox="0 0 32 32" width="30" height="30" aria-label="Zenith"><path d="M27 2l3 3-2 9-8 9-4-4 7-9z" fill="#7b5cff"/><path d="M27 2l3 3-3 6-3-5z" fill="#d9c8ff"/><path d="M10 15l7 7-3 3-7-7z" fill="#4fd6c8"/><circle cx="9" cy="23" r="3.2" fill="#e8ff8a"/><path d="M3 29l4-4 2 2-4 4z" fill="#d4af37"/></svg></div><div class="si pr" title="Forge">F</div><div class="si pr" title="Void">V</div><div class="si pr" title="Add server">+</div></nav>
<aside id="ch"><div class="brand">ZENITH HUB</div><div id="cl"></div></aside>
<section id="main">
<header id="hd"><h2 id="cn"></h2><span id="fpr"></span><input id="q" placeholder="Search  from:  has:code|link|pin|poll  in:channel" aria-label="Search"><button class="ib pr" id="bp">📌</button><select class="ib pr" id="ttl" hidden title="Auto-destruct"><option value="10000">🔥 10s</option><option value="30000" selected>🔥 30s</option><option value="60000">🔥 1m</option><option value="300000">🔥 5m</option><option value="exit">🔥 on exit</option></select><button class="ib pr" id="bm">👥</button><button class="ib pr" id="ba">📜</button><button class="ib pr" id="bb" title="New burner profile">🎭</button></header>
<div id="feed"></div><button id="pill" hidden></button><div id="typ"></div><div id="rp" hidden></div>
<div id="cmp"><div id="ac" hidden></div><textarea id="in" rows="1" maxlength="2000" placeholder="Message. Markdown, ||spoilers||, @mentions, / commands"></textarea><button class="ib pr" id="snd">⚔ Send</button></div>
</section>
<aside id="mem"></aside>
</div>
<div id="thr" class="dw" hidden></div><div id="aud" class="dw" hidden></div>
<dialog id="pal"><input id="pi" placeholder="Type a command or channel..." autocomplete="off"><div id="pl"></div></dialog>
<div id="ctx" hidden></div><div id="emo" hidden></div><div id="toast"></div>
<div id="decoy" hidden><h1>Q3 Budget.xlsx - Sheets</h1><table><tr><td>Item</td><td>Jan</td><td>Feb</td></tr><tr><td>Supplies</td><td>420</td><td>388</td></tr><tr><td>Travel</td><td>1,150</td><td>940</td></tr></table></div>
<script>
'use strict';
/* ===== Networking layer. The UI only ever calls ws.send(type,data) and ws.on(type,fn). =====
   Swap local mode for a real backend with:  new WebSocketManager('wss://your-host/ws')  (see WS_URL below). */
const WS_URL=null;
class LocalServer{
 constructor(w){this.w=w;this.db=this.load();this.last={};this.pw={forge:'zenith'}}
 load(){try{return JSON.parse(localStorage['zh:db'])}catch{return{msgs:{},audit:[],mods:{},slow:{}}}}
 save(){localStorage['zh:db']=JSON.stringify(this.db)}
 out(t,d,relay=true){this.w.emit(t,d);if(relay)this.w.bc.postMessage({t,d})}
 fromPeer({t,d}){if(!/^(priv\.|typing|presence|bye)/.test(t))this.db=this.load();this.w.emit(t,d)}
 bots(){return[{id:'b1',name:'ForgeKing',role:'Owner',status:'online',note:'Reforging the Zenith'},{id:'b2',name:'TerraBlade',role:'Admin',status:'idle',note:'Away from keyboard'},{id:'b3',name:'Sentinel',role:'Mod',status:'dnd',note:'Reviewing reports'},{id:'b4',name:'GreenSlime',role:'Member',status:'offline',note:''}]}
 handle(t,d){const db=this.db;
  if(t=='hello'){this.w.emit('sync',{db,bots:this.bots()});return}
  if(t=='chan.join'){this.pw[d.ch]&&this.pw[d.ch]!==d.pw?this.w.emit('err',{m:'Wrong password'}):this.w.emit('chan.ok',{ch:d.ch});return}
  if(/^(priv\.|typing|presence|bye)/.test(t)){this.w.bc.postMessage({t,d});return}
  if(t=='msg.new'){const md=db.mods[d.uid]||{},now=Date.now();
   if(md.ban&&(md.ban===1||md.ban>now))return this.w.emit('err',{m:'You are banned'});
   if(md.mute&&md.mute>now)return this.w.emit('err',{m:'You are muted'});
   const sl=db.slow[d.ch]||0,k=d.ch+d.uid;if(sl&&now-(this.last[k]||0)<sl*1e3)return this.w.emit('err',{m:`Slow mode: wait ${sl}s`});this.last[k]=now;
   const m={...d,id:crypto.randomUUID(),ts:now,rx:{}};(db.msgs[d.ch]??=[]).push(m);this.save();this.out('msg.new',m);
   if(/@TerraBlade/i.test(d.text)&&d.uid!='b2'){this.out('typing',{ch:d.ch,uid:'b2',name:'TerraBlade'},false);setTimeout(()=>this.handle('msg.new',{ch:d.ch,uid:'b2',name:'TerraBlade',text:`Hail, ${d.name}. The Zenith answers to those who dare. ⚔️`,th:d.th}),1600)}return}
  const arr=db.msgs[d.ch]||[],m=arr.find(x=>x.id==d.id);
  if(t=='msg.edit'&&m){(m.hist??=[]).push({t:m.text,ts:Date.now()});m.text=d.text;m.ed=1}
  if(t=='msg.del')db.msgs[d.ch]=arr.filter(x=>x.id!=d.id&&x.th!=d.id);
  if(t=='msg.pin'&&m)m.pin=!m.pin;
  if(t=='msg.react'&&m){const l=(m.rx[d.e]??=[]),i=l.indexOf(d.uid);i<0?l.push(d.uid):l.splice(i,1)}
  if(t=='msg.vote'&&m?.poll){m.poll.o.forEach(o=>o.v=o.v.filter(u=>u!=d.uid));m.poll.o[d.i].v.push(d.uid)}
  if(t=='mod'){const now=Date.now();db.mods[d.uid]??={};
   if(d.a=='mute')db.mods[d.uid].mute=now+6e5;if(d.a=='tempban')db.mods[d.uid].ban=now+36e5;if(d.a=='ban')db.mods[d.uid].ban=1;
   if(d.a=='purge')for(const c in db.msgs)db.msgs[c]=db.msgs[c].filter(x=>x.uid!=d.uid);
   if(d.a=='slow')db.slow[d.ch]=d.val;
   db.audit.unshift({ts:now,by:d.by,a:d.a,target:d.name||d.ch,v:d.val});db.audit.length=Math.min(db.audit.length,200);this.save();this.out('sync',{db,bots:this.bots()});return}
  this.save();this.out(t,d)}
}
class WebSocketManager{
 constructor(url){this.url=url;this.h={};this.q=[]}
 on(t,f){(this.h[t]??=[]).push(f);return this}
 emit(t,d){(this.h[t]||[]).forEach(f=>f(d))}
 connect(){
  if(this.url&&this.url.startsWith('wss://')){const s=this.ws=new WebSocket(this.url);s.onopen=()=>{this.q.splice(0).forEach(x=>s.send(x))};s.onmessage=e=>{const m=JSON.parse(e.data);this.emit(m.t,m.d)};s.onclose=()=>this.emit('status',{ok:0});return}
  this.bc=new BroadcastChannel('zenith-hub');this.local=new LocalServer(this);this.bc.onmessage=e=>this.local.fromPeer(e.data)}
 send(t,d){if(this.ws){const s=JSON.stringify({t,d});this.ws.readyState==1?this.ws.send(s):this.q.push(s)}else this.local.handle(t,d)}
}

/* ===== Helpers ===== */
const $=s=>document.querySelector(s),te=new TextEncoder(),td=new TextDecoder();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hue=s=>Math.abs([...s].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7))%360;
const av=n=>'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><defs><linearGradient id="g"><stop offset="0" stop-color="hsl(${hue(n)} 80% 55%)"/><stop offset="1" stop-color="#d4af37"/></linearGradient></defs><rect width="40" height="40" rx="12" fill="url(#g)"/><text x="20" y="27" font-size="20" text-anchor="middle" fill="#0B0C10" font-family="sans-serif" font-weight="700">${n[0]}</text></svg>`);
const EMO=['🔥','⚔️','💎','🌙','⭐','🐉','🛡️','🍄','👑','💀','🧪','🪄','🌈','🦋','🔮','⚡','🌋','🐙','🎯','🧿','🪙','🕯️','🗝️','🏹','🌟','🍀','🐺','🦊','🌊','❄️','☄️','🌱','🎲','📜','🔔','🪐','🍉','🚀','🧠','🦉'];
const ADJ=['Crimson','Void','Gilded','Astral','Cinder','Prism','Lunar','Ashen'],NOUN=['Wisp','Slime','Warden','Moth','Smith','Wyrm','Seer','Golem'];
const rnd=n=>crypto.getRandomValues(new Uint32Array(1))[0]%n;
const b64=u=>btoa(String.fromCharCode(...u)),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let toastT;const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2600)};

/* ===== State ===== */
const CH={Text:[['general'],['forge','🔒'],['memes']],Voice:[['Lounge'],['War Room']],Incognito:[['ember-den'],['void-hub']]};
const ws=new WebSocketManager(WS_URL);
let me=JSON.parse(localStorage['zh:me']||'null'),keys,pub;
const S={msgs:{},audit:[],mods:{},slow:{},mem:new Map()};
const P={msgs:[],peers:new Map()};                 // Incinerator: RAM only, never serialized
let cur='general',unlocked=new Set(),floor={},selId=null,replyTo=null,editing=null,thrId=null,newN=0,typers={},seenP=new Set();
const kind=c=>CH.Voice.some(x=>x[0]==c)?'voice':CH.Incognito.some(x=>x[0]==c)?'inc':'text';

async function newProfile(){
 const name=ADJ[rnd(8)]+NOUN[rnd(8)]+(10+rnd(90));
 keys=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);pub=await crypto.subtle.exportKey('jwk',keys.publicKey);
 me={id:crypto.randomUUID(),name,role:'Owner',status:'online',note:'Wielding the Zenith'};localStorage['zh:me']=JSON.stringify(me);
 P.peers.clear();P.msgs=[];S.mem.set(me.id,me)}

/* ===== Markdown ===== */
const hl=c=>c.replace(/(\/\/.*|#.*)$/gm,'<i class=cm>$1</i>').replace(/("[^"\n]*"|'[^'\n]*')/g,'<i class=st>$1</i>').replace(/\b(const|let|var|function|return|if|else|for|while|class|import|from|def|async|await|new|true|false|null|func|fn)\b/g,'<i class=kw>$1</i>').replace(/\b(\d+)\b/g,'<i class=nm>$1</i>');
function md(t){const cs=[],k=h=>'\x01'+(cs.push(h)-1)+'\x01';
 return esc(t).replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>k(`<div class=cb><button class=cp>Copy</button><pre><code>${hl(c)}</code></pre></div>`)).replace(/`([^`\n]+)`/g,(_,c)=>k(`<code>${c}</code>`))
 .replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target=_blank rel="noopener noreferrer">$1</a>')
 .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(?!\*)(.+?)\*/g,'<i>$1</i>').replace(/~~(.+?)~~/g,'<s>$1</s>').replace(/\|\|(.+?)\|\|/g,'<span class=sp>$1</span>')
 .replace(/^&gt; ?(.*)$/gm,'<div class=bq>$1</div>')
 .replace(/@(\w+)/g,(m,n)=>`<span class="mn${me&&n==me.name?' me':''}" style="color:hsl(${hue(n)} 85% 72%)">${m}</span>`)
 .replace(/\n/g,'<br>').replace(/\x01(\d+)\x01/g,(_,i)=>cs[i])}

/* ===== Rendering ===== */
